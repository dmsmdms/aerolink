# AeroLink security headers (included by sites-available/aerolink in every location that sets headers).
# CSP: everything from our own origin; WebRTC itself is not governed by CSP. Inline style attributes are
# allowed for Svelte-generated styles, inline scripts are not.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), microphone=(self), gamepad=(self), fullscreen=(self)" always;
