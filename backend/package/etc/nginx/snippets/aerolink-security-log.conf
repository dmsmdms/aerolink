# Security log (see the al_security map in sites-available/aerolink): to a file for people, and as
# syslog datagrams to `aerolink guard` (aerolink-guard.socket), which bans repeat offenders. An
# access_log in a location replaces the inherited ones, so locations with their own logging include this.
access_log /var/log/nginx/aerolink-security.log al_security if=$al_security;
access_log syslog:server=unix:/run/aerolink-guard.sock,nohostname,tag=aerolink al_guard if=$al_security;
