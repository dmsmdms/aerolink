[package]
name = "aerolink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
base64 = "0.22"
getrandom = "0.2"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "registry", "std"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"
