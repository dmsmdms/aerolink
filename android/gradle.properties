android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Release signing secrets do NOT belong here. Put them into ~/.gradle/gradle.properties:
#   AEROLINK_STORE_FILE=/absolute/path/to/aerolink.jks
#   AEROLINK_STORE_PASSWORD=...
#   AEROLINK_KEY_ALIAS=aerolink
#   AEROLINK_KEY_PASSWORD=...
# Without them the release APK is signed with the debug key (fine for bench testing only).
